version: "3.9"

services:
  proxy:
    build:
      context: .
      dockerfile: proxy/Dockerfile
    environment:
      - PORT=8000
      - FRONTEND_HOST=frontend:3000
      - BACKEND_HOST=backend:8080
    ports:
      - "8000:8000"
    depends_on:
      - frontend
      - backend

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      - PORT=8080
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
    ports:
      - "8080:8080"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      - PORT=3000
    ports:
      - "3000:3000"
